esphome:
  name: esphome-hub-ir
  friendly_name: ESPHome Hub IR
  min_version: 2026.4.0
  name_add_mac_suffix: false
  includes:
    - devices/samsung_ac/samsung_ac_codes.h
    - devices/fan/fan_codes.h
    - ir_dispatch.h

external_components:
  - source:
      type: local
      path: custom_components

esp8266:
  board: esp12e

# Enable logging
logger:

# Allow Over-The-Air updates
ota:
  - platform: esphome

captive_portal:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESPhome Config Wifi"
    password: ""

# Web Server & Captive Portal tắt để tiết kiệm tối đa RAM cho ESP8266
# web_server:
#   port: 80

# Enable Home Assistant API
api:
  services:
    - service: send_ir_code
      variables:
        code: string
      then:
        - lambda: |-
            size_t len = 0;
            const int32_t* pulses = get_any_ir_code(code, len);
            if (pulses != nullptr && len > 0) {
              std::vector<int32_t> vec = load_ir_code_vector(pulses, len);
              auto call = id(remote_transmitter_1).transmit();
              call.get_data()->set_carrier_frequency(38000);
              call.get_data()->set_data(vec);
              call.perform();
              ESP_LOGI("ir_send", "Transmitted '%s' (%d pulses)", code.c_str(), (int)len);
            } else {
              ESP_LOGW("ir_send", "Unknown IR code: '%s'", code.c_str());
            }

i2c:
  - id: i2c_1
    scl: 0
    sda: 2

sensor:
  - platform: hdc1080
    id: sensor_hdc1080_1
    i2c_id: i2c_1
    humidity:
      name: Humidity
      id: sensor_hdc1080_1_humidity
    temperature:
      name: Temperature
      id: sensor_hdc1080_1_temperature

remote_transmitter:
  - id: remote_transmitter_1
    pin: GPIO13
    carrier_duty_percent: 50%

remote_receiver:
  - id: remote_receiver_1
    pin:
      number: GPIO12
      mode:
        input: true
    buffer_size: 4kB
    dump:
      - samsung
      - nec
      - raw

infrared:
  - platform: ir_rf_proxy
    name: IR Transmitter
    remote_transmitter_id: remote_transmitter_1

  - platform: ir_rf_proxy
    name: IR Receiver
    receiver_frequency: 38kHz
    remote_receiver_id: remote_receiver_1

# Giao diện thực thể Climate chuẩn trên Home Assistant (tích hợp cảm biến nhiệt độ & độ ẩm HDC1080)
# Tích hợp đồng bộ 2 chiều qua mắt thu IR receiver_id: remote_receiver_1
climate:
  - platform: samsung_raw_climate
    name: "Điều Hoà Samsung"
    id: dieuhoa_samsung_climate
    transmitter_id: remote_transmitter_1
    receiver_id: remote_receiver_1
    sensor: sensor_hdc1080_1_temperature
    humidity_sensor: sensor_hdc1080_1_humidity
