esphome:
  name: esphome-hub-ir
  friendly_name: ESPHome Hub IR
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp8266:
  board: esp12e

# Enable logging
logger:

# Allow Over-The-Air updates
ota:
  - platform: esphome

captive_portal:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESPhome Config Wifi"
    password: ""

# Enable Web Server on port 80
#web_server:
#  port: 80

# Enable Home Assistant API
api:

i2c:
  - id: i2c_1
    scl: 0
    sda: 2

sensor:
  - platform: hdc1080
    id: sensor_hdc1080_1
    i2c_id: i2c_1
    humidity:
      name: Humidity
      id: sensor_hdc1080_1_humidity
    temperature:
      name: Temperature
      id: sensor_hdc1080_1_temperature

remote_transmitter:
  - id: remote_transmitter_1
    pin: GPIO13
    carrier_duty_percent: 50%

remote_receiver:
  - id: remote_receiver_1
    pin:
      number: GPIO12
      mode:
        input: true
    buffer_size: 4kB
    dump: all

infrared:
  - platform: ir_rf_proxy
    name: IR Transmitter
    remote_transmitter_id: remote_transmitter_1

  - platform: ir_rf_proxy
    name: IR Receiver
    receiver_frequency: 38kHz
    remote_receiver_id: remote_receiver_1