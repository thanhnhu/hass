esphome:
  name: esphome-web-5bc488
  friendly_name: ESPHome
  min_version: 2026.4.0
  name_add_mac_suffix: false
  includes:
    - devices/samsung_ac/samsung_ac_codes.h
    - devices/fan/fan_codes.h
    - ir_dispatch.h

external_components:
  - source:
      type: local
      path: custom_components

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

# Allow Over-The-Air updates
ota:
  - platform: esphome

# Enable Web Server on port 80
web_server:
  port: 80

# Tối ưu cho chip S3 N16R8 có PSRAM
psram:
  mode: octal

# Enable logging
logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable Home Assistant API with custom service to send IR
api:
  services:
    - service: send_ir_code
      variables:
        code: string
      then:
        - lambda: |-
            size_t len = 0;
            const int32_t* pulses = get_any_ir_code(code, len);
            if (pulses != nullptr && len > 0) {
              std::vector<int32_t> vec = load_ir_code_vector(pulses, len);
              auto call = id(my_ir_transmitter).transmit();
              call.get_data()->set_carrier_frequency(38000);
              call.get_data()->set_data(vec);
              call.perform();
              ESP_LOGI("ir_send", "Transmitted '%s' (%d pulses)", code.c_str(), (int)len);
            } else {
              ESP_LOGW("ir_send", "Unknown IR code: '%s'", code.c_str());
            }

# 1. Cấu hình mắt PHÁT hồng ngoại ở chân GPIO5 (Kích mức LOW)
# Với ESP32-S3 và ESP-IDF 5.x: rmt_symbols tối ưu là 64 (dùng streaming encoder, không cần block RAM lớn)
remote_transmitter:
  pin:
    number: GPIO5
    inverted: true
  carrier_duty_percent: 50%
  id: my_ir_transmitter
  rmt_symbols: 64
  non_blocking: true

# 2. Cấu hình mắt THU hồng ngoại ở chân GPIO4 để học lệnh và đồng bộ 2 chiều
# rmt_symbols: 64 để vừa vặn trong tổng bộ nhớ RMT phần cứng của ESP32-S3 (tránh lỗi out of RMT symbol memory)
remote_receiver:
  id: my_ir_receiver
  pin:
    number: GPIO4
    mode: INPUT_PULLUP
  rmt_symbols: 64
  buffer_size: 2048
  dump:
    - samsung
    - nec
    - raw

# 3. Giao diện thực thể Climate chuẩn trên Home Assistant (Đồng bộ 2 chiều qua mắt thu IR)
climate:
  - platform: samsung_raw_climate
    name: "Điều Hoà Samsung"
    id: dieuhoa_samsung_climate
    transmitter_id: my_ir_transmitter
    receiver_id: my_ir_receiver

