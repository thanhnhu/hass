esphome:
  name: esphome-esp32-s3
  friendly_name: ESPHome ESP32 S3
  on_boot:
    priority: -100
    then:
      - delay: 8s
      - script.execute: start_wake_word

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"

# Kết nối Wi-Fi nhà bạn (Nhớ đổi lại thông tin đúng)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

# Expose ESPHome Native API to Home Assistant (unencrypted unless api.encryption is configured)
api:
  homeassistant_services: true
logger:

globals:
  - id: continuous_conversation
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: speech_detected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: response_audio_pending
    type: bool
    restore_value: no
    initial_value: 'false'

ota:
  - platform: esphome

# Cấu hình Micro I2S INMP441
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO6   # Chân WS
    i2s_bclk_pin: GPIO5    # Chân SCK

microphone:
  - platform: i2s_audio
    id: echo_microphone
    i2s_din_pin: GPIO4     # Chân SD
    adc_type: external
    pdm: false
    channel: left
    bits_per_sample: 32bit
    correct_dc_offset: true
    on_data:
      - lambda: |-
          static uint32_t last_log = 0;
          static uint32_t previous_hash = 0;
          static uint32_t repeated_buffers = 0;
          static uint32_t buffers = 0;
          static uint32_t sample_count = 0;
          static int32_t peak = 0;
          static int64_t sample_sum = 0;
          static uint64_t squared_sum = 0;
          uint32_t hash = 2166136261U;
          for (uint8_t value : x) {
            hash = (hash ^ value) * 16777619U;
          }
          if (buffers > 0 && hash == previous_hash) repeated_buffers++;
          previous_hash = hash;
          buffers++;
          for (size_t offset = 0; offset + 3 < x.size(); offset += 4) {
            int32_t sample = esphome::audio::unpack_audio_sample_to_q31(&x[offset], 4) >> 16;
            peak = std::max(peak, std::abs(sample));
            sample_sum += sample;
            squared_sum += static_cast<int64_t>(sample) * sample;
            sample_count++;
          }
          const uint32_t now = millis();
          if (now - last_log >= 1000 && sample_count > 0) {
            const double mean = static_cast<double>(sample_sum) / sample_count;
            const double variance = static_cast<double>(squared_sum) / sample_count - mean * mean;
            ESP_LOGI("mic_level", "peak16=%ld rms_ac=%.1f repeated=%u/%u", static_cast<long>(peak), sqrt(std::max(0.0, variance)), repeated_buffers, buffers);
            peak = 0;
            sample_sum = 0;
            squared_sum = 0;
            sample_count = 0;
            repeated_buffers = 0;
            buffers = 0;
            last_log = now;
          }

# Cấu hình chuyển tiếp giọng nói về quy trình Wyoming của HASS
micro_wake_word:
  id: wake_word_detector
  microphone:
    microphone: echo_microphone
    channels: [0]
    gain_factor: 2
  models:
    - model: hey_jarvis
      id: hey_jarvis_model
      probability_cutoff: 0.85
  vad:
  on_wake_word_detected:
    - micro_wake_word.stop: {id: wake_word_detector}
    - switch.template.publish:
        id: listen_commands
        state: ON
    - homeassistant.action:
        action: tts.speak
        data:
          entity_id: tts.piper
          media_player_entity_id: media_player.tvbox_bluetooth
          message: "Mình đang nghe."
          cache: "false"
    - delay: 4s
    - lambda: |-
        id(continuous_conversation) = true;
        id(speech_detected) = false;
    - script.execute: conversation_idle_timeout
    - voice_assistant.start:
        silence_detection: true

voice_assistant:
  micro_wake_word: wake_word_detector
  microphone:
    microphone: echo_microphone
    channels: [0]
    gain_factor: 2
  noise_suppression_level: 3
  auto_gain: 15dBFS
  on_start:
    - micro_wake_word.stop: {id: wake_word_detector}
  on_stt_vad_start:
    - lambda: id(speech_detected) = true;
    - script.stop: conversation_idle_timeout
  on_tts_start:
    - lambda: id(response_audio_pending) = true;
  on_tts_end:
    - homeassistant.action:
        action: media_player.play_media
        data:
          entity_id: media_player.tvbox_bluetooth
          media_content_id: !lambda return x;
          media_content_type: music
    - delay: 500ms
    - wait_until:
        condition:
          lambda: return id(tvbox_player_state).state == "playing";
        timeout: 8s
    - wait_until:
        condition:
          lambda: return id(tvbox_player_state).state != "playing";
        timeout: 30s
    - delay: 800ms
    - lambda: id(response_audio_pending) = false;
  on_end:
    - if:
        condition:
          lambda: return id(continuous_conversation);
        then:
          - if:
              condition:
                lambda: return id(speech_detected);
              then:
                - lambda: id(speech_detected) = false;
                - script.execute: continue_conversation
              else:
                - voice_assistant.start:
                    silence_detection: true
        else:
          - switch.turn_off: listen_commands
  on_error:
    - script.stop: continue_conversation
    - script.stop: conversation_idle_timeout
    - lambda: id(continuous_conversation) = false;
    - lambda: id(speech_detected) = false;
    - lambda: id(response_audio_pending) = false;
    - switch.turn_off: listen_commands
  on_client_connected:
    - delay: 2s
    - script.execute: start_wake_word
  on_client_disconnected:
    - micro_wake_word.stop: {id: wake_word_detector}
    - script.stop: continue_conversation
    - script.stop: conversation_idle_timeout
    - lambda: id(continuous_conversation) = false;
    - lambda: id(speech_detected) = false;
    - lambda: id(response_audio_pending) = false;
    - switch.turn_off: listen_commands
  conversation_timeout: 300s

script:
  - id: continue_conversation
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: return !id(response_audio_pending);
          timeout: 40s
      - delay: 500ms
      - if:
          condition:
            lambda: return id(continuous_conversation);
          then:
            - script.execute: conversation_idle_timeout
            - voice_assistant.start:
                silence_detection: true

  - id: conversation_idle_timeout
    mode: restart
    then:
      - delay: 60s
      - if:
          condition:
            lambda: return id(continuous_conversation);
          then:
            - lambda: id(continuous_conversation) = false;
            - lambda: id(speech_detected) = false;
            - script.stop: continue_conversation
            - voice_assistant.stop:
            - switch.turn_off: listen_commands

  - id: start_wake_word
    mode: restart
    then:
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
          timeout: 10s
      - delay: 500ms
      - if:
          condition:
            and:
              - switch.is_on: wake_word_enabled
              - voice_assistant.connected
              - not:
                  voice_assistant.is_running:
          then:
            - micro_wake_word.start: {id: wake_word_detector}

text_sensor:
  - platform: homeassistant
    id: tvbox_player_state
    entity_id: media_player.tvbox_bluetooth

switch:
  - platform: template
    id: listen_commands
    name: "Nghe lệnh"
    icon: mdi:microphone
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - if:
          condition: voice_assistant.connected
          then:
            - micro_wake_word.stop: {id: wake_word_detector}
            - voice_assistant.start:
          else:
            - switch.turn_off: listen_commands
    turn_off_action:
      - script.stop: continue_conversation
      - script.stop: conversation_idle_timeout
      - lambda: id(continuous_conversation) = false;
      - lambda: id(speech_detected) = false;
      - voice_assistant.stop:
      - script.execute: start_wake_word

  - platform: template
    id: wake_word_enabled
    name: "Bật wake word"
    icon: mdi:microphone-message
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: start_wake_word
    turn_off_action:
      - micro_wake_word.stop: {id: wake_word_detector}