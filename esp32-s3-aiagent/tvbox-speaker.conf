music_directory "/DATA/AppData/tvbox-speaker/music"
playlist_directory "/DATA/AppData/tvbox-speaker/playlists"
db_file "/DATA/AppData/tvbox-speaker/database"
state_file "/DATA/AppData/tvbox-speaker/state"
sticker_file "/DATA/AppData/tvbox-speaker/stickers"
bind_to_address "127.0.0.1"
port "6600"
zeroconf_enabled "no"
restore_paused "yes"
max_playlist_length "32"

audio_output {
    type "pulse"
    name "TVBox Bluetooth"
    server "unix:/run/user/0/pulse/native"
    sink "bluez_output.E8_07_BF_19_F1_D2.1"
    mixer_type "software"
}